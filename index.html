<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de API Key de IA</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input[type="password"], input[type="text"] { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .message { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Configurar API Key</h2>
    <label for="apiKey">Ingresa tu llave de API:</label>
    <input type="password" id="apiKey" placeholder="sk-...">
    <button onclick="guardarKey()">Guardar Key</button>
    <button onclick="probarKey()" style="background-color: #28a745;">Probar Conexión</button>
    
    <div class="message" id="statusMessage"></div>

    <script>
        document.getElementById('apiKey').value = localStorage.getItem('ai_api_key') || '';

        function guardarKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem('ai_api_key', key);
                document.getElementById('statusMessage').style.color = 'green';
                document.getElementById('statusMessage').innerText = 'Clave guardada exitosamente en el navegador.';
            } else {
                document.getElementById('statusMessage').style.color = 'red';
                document.getElementById('statusMessage').innerText = 'Por favor ingresa una clave válida.';
            }
        }

        async function probarKey() {
            const key = localStorage.getItem('ai_api_key');
            if (!key) {
                document.getElementById('statusMessage').style.color = 'red';
                document.getElementById('statusMessage').innerText = 'No hay ninguna clave guardada para probar.';
                return;
            }

            document.getElementById('statusMessage').style.color = 'orange';
            document.getElementById('statusMessage').innerText = 'Probando conexión...';

            try {
                const response = await fetch('https://openai.com', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${key}`
                    }
                });

                if (response.ok) {
                    document.getElementById('statusMessage').style.color = 'green';
                    document.getElementById('statusMessage').innerText = '¡Conexión exitosa! La API Key es válida.';
                } else {
                    document.getElementById('statusMessage').style.color = 'red';
                    document.getElementById('statusMessage').innerText = 'Error: La API Key no es válida o expiró.';
                }
            } catch (error) {
                document.getElementById('statusMessage').style.color = 'red';
                document.getElementById('statusMessage').innerText = 'Error de red al intentar conectar.';
            }
        }
    </script>

</body>
</html>
